replicaCount: 1

image:
  repository: rhonkar/${{values.app_name}}
  pullPolicy: IfNotPresent
  tag: ${{values.app_name}}-${{values.app_env}}-latest

imagePullSecrets: []

nameOverride: ""

fullnameOverride: ""

podAnnotations: {}

podLabels: {}

serviceAccount:
  create: false
  automount: true
  annotations: {}
  name: ""

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 5000

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: rest-service.net
      paths:
        - path: /${{values.app_name}}-${{values.app_env}}
          pathType: Prefix
  tls:
    - secretName: rest-service-tls
      hosts:
        - rest-service.net

env:
  - name: INFO_MESSAGE
    value: "Default Info Message"

resources:
  requests:
    cpu: 50m
    memory: 50M

livenessProbe:
  httpGet:
    path: /api/v1/healthz
    port: http

readinessProbe:
  httpGet:
    path: /api/v1/healthz
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
