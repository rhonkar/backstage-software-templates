name: ${{values.app_name}}-cicd

on:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:

      - name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ '${{ vars.DOCKERHUB_USERNAME }}' }}
          password: ${{ '${{ secrets.DOCKERHUB_TOKEN }}' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ '${{ vars.DOCKERHUB_USERNAME }}' }}/${{values.app_name}}:${{ '${{ env.COMMIT_ID }}' }}
            ${{ '${{ vars.DOCKERHUB_USERNAME }}' }}/${{values.app_name}}:latest
    outputs:
      commit_id: ${{ '${{ env.COMMIT_ID }}' }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:

      - name: Install Argocd
        shell: bash
        run: |
          curl -ksSL -o argocd https:/${{ '${{ vars.ARGOCD_SERVER }}' }}/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd

      - name: Argocd login
        shell: bash
        run: |
          argocd login ${{ '${{ vars.ARGOCD_SERVER }}' }} \
            --insecure \
            --grpc-web \
            --username ${{ '${{ vars.ARGOCD_USERNAME }}' }} \
            --password  ${{ '${{ secrets.ARGOCD_PASSWORD }}' }}

      - name: Ensure argocd repo and app
        shell: bash
        run: |
          # Connects the argocd repo
          repo="https://github.com/rhonkar-global/${{values.app_name}}.git"
          argocd repo list | grep -q $repo || argocd repo add $repo

          # Creates the argocd app
          argocd app get ${{values.app_name}} || argocd app create ${{values.app_name}} \
            --repo $repo \
            --path charts/${{values.app_name}} \
            --dest-namespace ${{values.app_env}} \
            --dest-server https://kubernetes.default.svc \
            --values values-${{values.app_env}}.yaml \
            --revision main \
            --sync-policy manual \
            --sync-option CreateNamespace=true

      - name: Argocd app sync
        shell: bash
        run: |
          argocd app set ${{values.app_name}} -p image.tag="${{ '${{ needs.ci.outputs.commit_id }}' }}"
          if [ -n "${{ '${{ vars.INFO_MESSAGE }}' }}" ]; then
            argocd app set ${{values.app_name}} -p env[0].name="INFO_MESSAGE"
            argocd app set ${{values.app_name}} -p env[0].value="${{ '${{ vars.INFO_MESSAGE }}' }}"
          fi
          argocd app sync ${{values.app_name}} --grpc-web
          argocd app wait ${{values.app_name}} --timeout 180
